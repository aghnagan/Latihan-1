<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profil saya</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .profile-card {
      background: white;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 320px;
      transition: transform 0.3s;
    }

    .profile-card:hover {
      transform: translateY(-10px);
    }

    .profile-img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #764ba2;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 24px;
      color: #333;
    }

    .job {
      color: #764ba2;
      font-size: 15px;
      margin-top: 5px;
      margin-bottom: 15px;
    }

    .bio {
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }

    .socials a {
      text-decoration: none;
      margin: 5px;
      display: inline-block;
      padding: 10px 14px;
      background: #764ba2;
      color: white;
      border-radius: 10px;
      font-size: 14px;
      transition: background 0.3s;
    }

    .socials a:hover {
      background: #5a378a;
    }
  </style>
</head>
<body>
  <div class="profile-card">
    <img src="https://i.imgur.com/wvxPV9S.png" alt="Foto Profil" class="profile-img" />
    <h1>Aghna Noer Sabrina</h1>
    <p class="job">Siswi SMK Negeri 1 Banyumas</p>
    <p class="bio">
      hai nama saya Aghna Noer Sabrina, biasa dipanggil Aghna, Agan, Nana. saya bersekolah di SMK Negeri 1 Banyumas, kelas XI TJKT
1, absen 1.
    </p>
    <div class="socials">
      <a href="#">Instagram</a>
      <a href="#">LinkedIn</a>
      <a href="#">GitHub</a>
    </div>
  </div>
</body>
</html>
